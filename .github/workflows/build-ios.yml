name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate iOS project)
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Disable signing in project.pbxproj
        run: |
          echo "=== Patching project.pbxproj ==="
          PBXPROJ=$(find ios -maxdepth 2 -name "project.pbxproj" | head -1)
          echo "Found: $PBXPROJ"
          sed -i '' \
            -e 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' \
            -e 's/DEVELOPMENT_TEAM = "[^"]*";/DEVELOPMENT_TEAM = "";/g' \
            -e 's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "";/g' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/PROVISIONING_PROFILE_SPECIFIER = ".*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            -e 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' \
            -e 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' \
            "$PBXPROJ"
          echo "=== Patched pbxproj ==="

      - name: Disable signing in Podfile (post_install hook)
        run: |
          python3 - <<'PY'
          import re

          with open("ios/Podfile", "r") as f:
              content = f.read()

          patch = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['DEVELOPMENT_TEAM'] = ''
              end
            end
          """

          if 'post_install do |installer|' in content:
              content = content.replace(
                  'post_install do |installer|',
                  'post_install do |installer|\n' + patch
              )
          else:
              content += '\npost_install do |installer|\n' + patch + '\nend\n'

          with open("ios/Podfile", "w") as f:
              f.write(content)

          print("Podfile patched successfully")
          PY

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          CI: 1

      - name: Detect Xcode workspace and scheme
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          XCODEPROJ=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "workspace=$WORKSPACE" >> $GITHUB_ENV
          echo "scheme=$SCHEME" >> $GITHUB_ENV
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Build unsigned .app
        run: |
          cat > /tmp/nosign.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          CODE_SIGN_ENTITLEMENTS =
          PROVISIONING_PROFILE =
          PROVISIONING_PROFILE_SPECIFIER =
          DEVELOPMENT_TEAM =
          AD_HOC_CODE_SIGNING_ALLOWED = YES
          ENABLE_BITCODE = NO
          ONLY_ACTIVE_ARCH = NO
          DEBUG_INFORMATION_FORMAT = dwarf
          GCC_OPTIMIZATION_LEVEL = 0
          SWIFT_OPTIMIZATION_LEVEL = -Onone
          EOF

          set -o pipefail
          xcodebuild build \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            -xcconfig /tmp/nosign.xcconfig \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log

          exit ${PIPESTATUS[0]}

      - name: Show last 150 lines of build log on failure
        if: failure()
        run: |
          echo "=== LAST 150 LINES OF BUILD LOG ==="
          tail -150 build.log || echo "No build.log found"
          echo ""
          echo "=== ERROR LINES ONLY ==="
          grep -E "^.*(error:|BUILD FAILED|fatal error)" build.log | tail -60 || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          retention-days: 5

      - name: Package .app into .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App found at: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle found!"
            ls -la build/Build/Products/ || true
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r iphone-check.ipa Payload
          ls -lh iphone-check.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iphone-check-ipa
          path: iphone-check.ipa
          retention-days: 30
          if-no-files-found: error
