name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate iOS project)
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
        env:
          CI: 1

      - name: List Xcode schemes
        id: xcode
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "=== Available schemes ==="
          xcodebuild -list -workspace "$WORKSPACE" 2>&1
          # Pick the first non-Pods scheme
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>&1 | awk '/Schemes:/,/^$/' | tail -n +2 | grep -v Pods | head -1 | tr -d ' ')
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "=== Using scheme: $SCHEME ==="

      - name: Disable signing via xcconfig
        run: |
          cat > /tmp/nosign.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          CODE_SIGN_ENTITLEMENTS =
          PROVISIONING_PROFILE =
          PROVISIONING_PROFILE_SPECIFIER =
          DEVELOPMENT_TEAM =
          AD_HOC_CODE_SIGNING_ALLOWED = YES
          EOF
          echo "nosign_xcconfig=/tmp/nosign.xcconfig" >> $GITHUB_ENV

      - name: Build Release .app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            -xcconfig "${{ env.nosign_xcconfig }}" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log
          # Check real exit code (tee hides it)
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          retention-days: 5

      - name: Package .app into .ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found!"; exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r iphone-check.ipa Payload
          ls -lh iphone-check.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iphone-check-ipa
          path: iphone-check.ipa
          retention-days: 30
          if-no-files-found: error
